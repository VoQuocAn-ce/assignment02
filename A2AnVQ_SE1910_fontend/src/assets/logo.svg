<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Shield / Hexagon -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Newspaper / Content Stack Shapes -->
  <path d="M30 40 C30 36, 34 34, 38 34 L76 34 C80 34, 84 36, 84 40 L84 76 C84 80, 80 84, 76 84 L38 84 C34 84, 30 80, 30 76 Z" fill="#ffffff" fill-opacity="0.95" />
  
  <!-- News header line (orange) -->
  <rect x="38" y="42" width="30" height="7" rx="3.5" fill="url(#accentGrad)" />
  <circle cx="76" cy="45.5" r="3.5" fill="#2563eb" />

  <!-- Text lines -->
  <rect x="38" y="55" width="44" height="4" rx="2" fill="#94a3b8" />
  <rect x="38" y="63" width="36" height="4" rx="2" fill="#cbd5e1" />
  <rect x="38" y="71" width="24" height="4" rx="2" fill="#cbd5e1" />

  <!-- Quill / Innovation Spark -->
  <path d="M78 26 L94 42 L88 48 L72 32 Z" fill="url(#accentGrad)" />
  <polygon points="72,32 68,36 71,38" fill="#c2410c" />

  <!-- Mini FU badge -->
  <rect x="70" y="66" width="16" height="12" rx="3" fill="#2563eb" />
  <text x="78" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">FU</text>
</svg>
